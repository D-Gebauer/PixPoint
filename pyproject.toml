[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixpoint"
version = "8.0.0"
authors = [
    { name="David Gebauer", email="git@gebauer.ai" },
]
description = "Two-point, three-point, integrated three-point and one-point statistics of HEALPix maps, on CPUs and GPUs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "astronomy", "cosmology", "correlation-functions", "three-point-functions",
    "weak-lensing", "galaxy-clustering", "galaxy-galaxy-lensing", "healpix", "gpu",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.9.0",
    "numba>=0.50.0",
    "healpy>=1.10.0",
    "h5py>=3.0.0",
    "tqdm",
]

[project.optional-dependencies]
gpu = [
    # The CUDA 12 wheel: plain "cupy" is the source distribution and compiles
    # CuPy on install. CUDA 13 users install cupy-cuda13x themselves.
    "cupy-cuda12x>=13.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-env>=0.8.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "scipy-stubs",
    "pre-commit>=2.0.0",
    "treecorr",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[project.urls]
Homepage = "https://github.com/D-Gebauer/PixPoint"
Repository = "https://github.com/D-Gebauer/PixPoint"
Documentation = "https://pixpoint.readthedocs.io"
"Bug Tracker" = "https://github.com/D-Gebauer/PixPoint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"pixpoint" = ["cuda/*.cu", "cuda/*.cuh", "py.typed"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["pixpoint"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# No stubs or py.typed marker: these are typed as Any.
[[tool.mypy.overrides]]
module = ["cupy", "cupy.*", "cupyx", "cupyx.*", "h5py", "h5py.*", "healpy", "healpy.*", "tqdm", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
env = [
    "NUMBA_DISABLE_JIT=1",
]
# Coverage is a CI concern, not a default: forcing it here made every
# invocation -- including a single-test debug run -- instrument the whole
# package and rewrite htmlcov/.  `make coverage` and the CI job ask for it.
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
]
